services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pdfhandler
      MYSQL_USER: pdfhandler
      MYSQL_PASSWORD: pdfhandler
      MYSQL_ROOT_PASSWORD: root
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports: ['3306:3306']
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppdfhandler', '-updfhandler']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_USER: pdfhandler
      DB_PASSWORD: pdfhandler
      DB_NAME: pdfhandler
      REDIS_URL: redis://redis:6379
      # Mount a TTF/OTF (e.g. NotoSansKR) and point here to allow Korean text in server-side operations.
      PDF_FONT_PATH: ''
    ports: ['3000:3000']
    volumes: [pdf-storage:/data]

volumes:
  mysql-data:
  pdf-storage:
