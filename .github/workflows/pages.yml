# Publishes the browser-only demo (frontend built with VITE_DEMO=1) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, claude/magical-feynman-5y7cla]
    paths:
      - frontend/**
      - packages/core/**
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w @pdfhandler/core -w frontend
      - run: npm test -w @pdfhandler/core
      - run: npm run build -w frontend
        env:
          VITE_DEMO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
